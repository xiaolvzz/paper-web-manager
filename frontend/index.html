<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📚 论文管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">论文列表</a>
                <a class="nav-link" href="/graph">关系图</a>
                <a class="nav-link" href="#" onclick="openAISettings(); return false;">
                    ⚙️ AI设置
                    <span class="badge bg-primary" id="currentModelBadge" style="font-size: 0.7rem;">加载中</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 搜索和筛选 -->
        <div class="search-box">
            <div class="row g-3">
                <div class="col-md-6">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索论文标题或作者...">
                </div>
                <div class="col-md-3">
                    <input type="number" class="form-control" id="yearFilter" placeholder="年份筛选">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="searchPapers()">
                        <span id="searchBtnText">搜索</span>
                        <span id="searchSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addPaperModal">
                    + 添加论文
                </button>
            </div>
        </div>

        <!-- 论文列表 -->
        <div id="papersList"></div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state d-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <h5>还没有论文</h5>
            <p>点击"添加论文"开始记录你的第一篇论文</p>
        </div>
    </div>

    <!-- 添加论文Modal -->
    <div class="modal fade" id="addPaperModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加论文</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- arXiv快速添加 -->
                    <div class="mb-4 p-3 bg-light rounded">
                        <h6 class="mb-3">🔍 从arXiv添加论文</h6>

                        <!-- 方式1: 在arXiv网站搜索 -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">方式1：在arXiv网站搜索</label>
                            <div class="d-flex gap-2">
                                <input type="text" class="form-control form-control-sm" id="arxivWebSearchInput" placeholder="输入关键词...">
                                <button class="btn btn-sm btn-primary" onclick="openArxivSearch()">
                                    打开arXiv搜索
                                </button>
                            </div>
                            <small class="text-muted">在新窗口搜索论文，找到后复制PDF链接粘贴到下方</small>
                        </div>

                        <!-- 方式2: 直接粘贴PDF链接 -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">方式2：粘贴PDF链接直接添加</label>
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control" id="arxivPdfUrl" placeholder="https://arxiv.org/pdf/2301.12345.pdf">
                                <button class="btn btn-success" type="button" onclick="addFromPdfUrl()">
                                    <span id="pdfUrlBtnText">添加</span>
                                    <span id="pdfUrlSpinner" class="spinner-border spinner-border-sm d-none"></span>
                                </button>
                            </div>
                            <small class="text-muted">支持格式: https://arxiv.org/pdf/xxx.pdf 或 https://arxiv.org/abs/xxx</small>
                        </div>

                        <!-- 方式3: 内置搜索 -->
                        <div>
                            <label class="form-label small fw-bold">方式3：内置搜索</label>
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" class="form-control" id="arxivSearchInput" placeholder="输入论文标题或关键词...">
                                <button class="btn btn-outline-primary" type="button" onclick="searchArxiv()">
                                    <span id="arxivSearchBtnText">搜索</span>
                                    <span id="arxivSearchSpinner" class="spinner-border spinner-border-sm d-none"></span>
                                </button>
                            </div>
                            <div id="arxivResults"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <hr>
                        <p class="text-center text-muted small mb-3">或手动输入论文信息</p>
                    </div>

                    <form id="addPaperForm">
                        <div class="mb-3">
                            <label class="form-label">论文标题 *</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">作者</label>
                            <input type="text" class="form-control" name="authors" placeholder="多个作者用逗号分隔">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">年份</label>
                                <input type="number" class="form-control" name="year" min="1900" max="2100">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">标签</label>
                                <input type="text" class="form-control" name="tags" placeholder="多个标签用逗号分隔">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">PDF路径或链接</label>
                            <input type="text" class="form-control" name="pdf_path" placeholder="本地路径或云盘链接">
                            <small class="text-muted">例如：D:\Papers\paper.pdf 或 https://arxiv.org/pdf/xxxx</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">摘要</label>
                            <textarea class="form-control" name="abstract" rows="4"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">GitHub代码链接</label>
                            <input type="url" class="form-control" name="github_url" placeholder="https://github.com/username/repo">
                            <small class="text-muted">论文对应的GitHub代码仓库链接</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">研究领域</label>
                            <select class="form-select" name="domain">
                                <option value="">请选择研究领域</option>
                                <option value="NLP">自然语言处理 (NLP)</option>
                                <option value="CV">计算机视觉 (CV)</option>
                                <option value="RL">强化学习 (RL)</option>
                                <option value="ML">机器学习 (ML)</option>
                                <option value="Robotics">机器人 (Robotics)</option>
                                <option value="Theory">理论研究 (Theory)</option>
                                <option value="Systems">系统与架构 (Systems)</option>
                                <option value="Other">其他 (Other)</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addPaper()">
                        <span id="addBtnText">添加</span>
                        <span id="addSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script id="aiSettingsModalContainer"></script>
    <script>
        // 动态插入AI设置Modal
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof getAISettingsModalHTML === 'function') {
                document.getElementById('aiSettingsModalContainer').outerHTML = getAISettingsModalHTML();
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/cache.js"></script>
    <script src="/assets/js/loading.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ai-settings.js"></script>
    <script src="/assets/js/index.js"></script>
</body>
</html>
