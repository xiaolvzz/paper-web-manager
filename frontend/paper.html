<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文详情 - 论文管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📚 论文管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">论文列表</a>
                <a class="nav-link" href="/graph">关系图</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- 论文基本信息 -->
        <div class="detail-section">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h2 id="paperTitle">加载中...</h2>
                <button class="btn btn-primary" onclick="toggleEditMode()">
                    <span id="editBtnText">编辑</span>
                </button>
            </div>
            <div id="paperInfo"></div>
        </div>

        <!-- 论文内容输入 -->
        <div class="detail-section" id="contentInputSection">
            <h4>📄 论文内容</h4>
            <p class="text-muted small mb-3">添加论文全文内容，让AI能够深入分析论文</p>

            <!-- Tab切换 -->
            <ul class="nav nav-tabs" id="contentTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="arxiv-tab" data-bs-toggle="tab" data-bs-target="#arxivTab" type="button">
                        arXiv导入
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="text-tab" data-bs-toggle="tab" data-bs-target="#textTab" type="button">
                        文本输入
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="contentTabsContent">
                <!-- arXiv导入 -->
                <div class="tab-pane fade" id="arxivTab" role="tabpanel">
                    <input type="text" id="arxivInput" class="form-control mb-2" placeholder="输入arXiv ID或URL (如: 1706.03762 或 https://arxiv.org/abs/1706.03762)">
                    <button class="btn btn-primary" onclick="importFromArxiv()">
                        <span id="arxivBtnText">导入</span>
                        <span id="arxivSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                    <div id="arxivStatus" class="mt-2"></div>
                </div>

                <!-- 手动输入 -->
                <div class="tab-pane fade show active" id="textTab" role="tabpanel">
                    <textarea id="textContent" class="form-control mb-2" rows="8" placeholder="粘贴论文全文或关键内容（摘要、方法、结果等）..."></textarea>
                    <button class="btn btn-primary" onclick="addTextContent()">
                        <span id="textBtnText">保存</span>
                        <span id="textSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                    <div id="textStatus" class="mt-2"></div>
                </div>
            </div>

            <!-- 内容状态显示 -->
            <div id="contentStatus" class="mt-3">
                <small id="contentStatusText" class="text-muted">暂无论文内容</small>
            </div>
        </div>

        <!-- AI对话助手 -->
        <div class="detail-section" id="chatSection">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">💬 AI对话助手</h4>
                <div>
                    <button class="btn btn-sm btn-info" onclick="autoAnalyzePaper()" title="使用AI自动分析论文">
                        一键分析
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="clearConversations()" title="清空当前论文的所有对话">
                        清空对话
                    </button>
                </div>
            </div>

            <!-- 快捷问题按钮 -->
            <div class="quick-questions">
                <button class="btn btn-sm btn-outline-primary" onclick="askQuickQuestion('这篇论文的主要创新点是什么？')">
                    创新点
                </button>
                <button class="btn btn-sm btn-outline-primary" onclick="askQuickQuestion('这篇论文使用了哪些方法？')">
                    使用方法
                </button>
                <button class="btn btn-sm btn-outline-primary" onclick="askQuickQuestion('论文的框架结构是怎样的？')">
                    框架结构
                </button>
                <button class="btn btn-sm btn-outline-primary" onclick="askQuickQuestion('有没有源代码？')">
                    源码
                </button>
                <button class="btn btn-sm btn-outline-primary" onclick="askQuickQuestion('帮我总结这篇论文')">
                    论文总结
                </button>
            </div>

            <!-- 对话历史显示区 -->
            <div id="chatHistory" class="chat-history">
                <p class="text-muted text-center">暂无对话记录，开始提问吧！</p>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
                <textarea id="chatInput" rows="2" placeholder="输入你的问题... (Shift+Enter换行，Enter发送)" onkeydown="handleChatKeydown(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">
                    发送
                </button>
            </div>

            <!-- AI状态提示 -->
            <div class="mt-2">
                <small class="text-muted" id="aiConfigStatus">检查AI配置中...</small>
            </div>
        </div>

        <!-- 原有的AI助手（保留简单功能） -->
        <div class="detail-section">
            <h4>🤖 快速AI分析</h4>
            <p class="text-muted small mb-3">基于摘要快速生成分析（无需论文全文）</p>
            <div class="d-flex gap-2 mb-3">
                <button class="btn btn-outline-primary" onclick="generateAISummary()">
                    <span id="aiSummaryBtnText">生成中文摘要</span>
                    <span id="aiSummarySpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
                <button class="btn btn-outline-success" onclick="extractInnovations()">
                    <span id="aiInnovationBtnText">提取创新点</span>
                    <span id="aiInnovationSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </div>
            <div id="aiOutput" class="d-none">
                <div class="alert alert-info">
                    <div id="aiOutputContent"></div>
                    <button class="btn btn-sm btn-link float-end" onclick="copyAIOutput()">复制到分析区</button>
                </div>
            </div>
        </div>

        <!-- 分析记录 -->
        <div class="detail-section">
            <h4>📊 分析记录</h4>

            <!-- 创新点分析 -->
            <div class="mb-4">
                <label class="form-label fw-bold">创新点分析</label>
                <textarea class="form-control" id="innovationPoints" rows="6" placeholder="输入创新点分析..."></textarea>
            </div>

            <!-- 框架图 -->
            <div class="mb-4">
                <label class="form-label fw-bold">框架图</label>
                <div id="frameworkImageContainer"></div>
                <input type="file" class="form-control mt-2" id="frameworkImageInput" accept="image/*">
                <button class="btn btn-sm btn-primary mt-2" onclick="uploadFrameworkImage()">
                    <span id="uploadBtnText">上传图片</span>
                    <span id="uploadSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </div>

            <!-- 个人备注 -->
            <div class="mb-4">
                <label class="form-label fw-bold">个人备注</label>
                <textarea class="form-control" id="personalNotes" rows="6" placeholder="输入个人备注..."></textarea>
            </div>

            <button class="btn btn-success" onclick="saveAnalysis()">
                <span id="saveBtnText">保存分析</span>
                <span id="saveSpinner" class="spinner-border spinner-border-sm d-none"></span>
            </button>
        </div>

        <!-- 关联关系 -->
        <div class="detail-section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">🔗 关联论文</h4>
                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addRelationModal">
                    + 添加关联
                </button>
            </div>
            <div id="relationsList"></div>
        </div>
    </div>

    <!-- 添加关联关系Modal -->
    <div class="modal fade" id="addRelationModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加关联关系</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addRelationForm">
                        <div class="mb-3">
                            <label class="form-label">关联论文 *</label>
                            <select class="form-select" id="relatedPaperSelect" required>
                                <option value="">选择论文...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">关系类型 *</label>
                            <select class="form-select" id="relationTypeSelect" required>
                                <option value="method_similar">方法相似</option>
                                <option value="problem_related">问题相关</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">关系描述</label>
                            <textarea class="form-control" id="relationDescription" rows="3" placeholder="可选：描述两篇论文的关系..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addRelation()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/paper.js"></script>
</body>
</html>
