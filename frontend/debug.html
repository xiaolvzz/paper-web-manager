<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>📋 功能诊断测试</h1>
        <p class="text-muted">此页面用于测试API和基础功能</p>

        <!-- 测试1: API健康检查 -->
        <div class="card mb-3">
            <div class="card-header">测试1: API健康检查</div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testHealth()">测试 /api/health</button>
                <div id="health-result" class="mt-2"></div>
            </div>
        </div>

        <!-- 测试2: 获取论文列表 -->
        <div class="card mb-3">
            <div class="card-header">测试2: 获取论文列表</div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testGetPapers()">测试 GET /api/papers/</button>
                <div id="papers-result" class="mt-2"></div>
            </div>
        </div>

        <!-- 测试3: 添加论文 -->
        <div class="card mb-3">
            <div class="card-header">测试3: 添加论文</div>
            <div class="card-body">
                <input type="text" id="testTitle" class="form-control mb-2" placeholder="论文标题" value="测试论文">
                <input type="text" id="testAuthor" class="form-control mb-2" placeholder="作者" value="测试作者">
                <button class="btn btn-success" onclick="testAddPaper()">测试 POST /api/papers/</button>
                <div id="add-result" class="mt-2"></div>
            </div>
        </div>

        <!-- 测试4: arXiv导入 -->
        <div class="card mb-3">
            <div class="card-header">测试4: arXiv导入</div>
            <div class="card-body">
                <input type="text" id="testArxivId" class="form-control mb-2" placeholder="arXiv ID" value="1706.03762">
                <input type="number" id="testPaperId" class="form-control mb-2" placeholder="论文ID (先添加论文)" value="1">
                <button class="btn btn-info" onclick="testArxivImport()">测试 arXiv导入</button>
                <div id="arxiv-result" class="mt-2"></div>
            </div>
        </div>

        <!-- 日志 -->
        <div class="card">
            <div class="card-header">
                控制台日志
                <button class="btn btn-sm btn-secondary float-end" onclick="clearLog()">清空</button>
            </div>
            <div class="card-body">
                <pre id="console-log" style="max-height: 300px; overflow-y: auto; background: #f5f5f5; padding: 10px;"></pre>
            </div>
        </div>
    </div>

    <script>
        // 日志函数
        function log(message, type = 'info') {
            const logEl = document.getElementById('console-log');
            const time = new Date().toLocaleTimeString();
            const colors = {
                info: '#000',
                success: '#28a745',
                error: '#dc3545',
                warning: '#ffc107'
            };
            logEl.innerHTML += `<span style="color: ${colors[type]}">[${time}] ${message}</span>\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            document.getElementById('console-log').innerHTML = '';
        }

        function showResult(elementId, message, isSuccess) {
            const el = document.getElementById(elementId);
            el.className = `alert ${isSuccess ? 'alert-success' : 'alert-danger'} mt-2`;
            el.textContent = message;
        }

        // 测试1: 健康检查
        async function testHealth() {
            log('测试 /api/health...');
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                log('✓ 健康检查成功: ' + JSON.stringify(data), 'success');
                showResult('health-result', '✓ API正常: ' + JSON.stringify(data), true);
            } catch (error) {
                log('✗ 健康检查失败: ' + error.message, 'error');
                showResult('health-result', '✗ 失败: ' + error.message, false);
            }
        }

        // 测试2: 获取论文列表
        async function testGetPapers() {
            log('测试 GET /api/papers/...');
            try {
                const response = await fetch('/api/papers/');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                log(`✓ 获取成功: 共 ${data.length} 篇论文`, 'success');
                showResult('papers-result', `✓ 成功: 共 ${data.length} 篇论文`, true);
            } catch (error) {
                log('✗ 获取失败: ' + error.message, 'error');
                showResult('papers-result', '✗ 失败: ' + error.message, false);
            }
        }

        // 测试3: 添加论文
        async function testAddPaper() {
            const title = document.getElementById('testTitle').value;
            const author = document.getElementById('testAuthor').value;

            log('测试 POST /api/papers/...');
            log('数据: ' + JSON.stringify({title, authors: author, year: 2024}));

            try {
                const response = await fetch('/api/papers/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        authors: author,
                        year: 2024
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();
                log('✓ 添加成功! ID: ' + data.id, 'success');
                showResult('add-result', `✓ 成功! 论文ID: ${data.id}`, true);

                // 更新paper ID输入框
                document.getElementById('testPaperId').value = data.id;
            } catch (error) {
                log('✗ 添加失败: ' + error.message, 'error');
                showResult('add-result', '✗ 失败: ' + error.message, false);
            }
        }

        // 测试4: arXiv导入
        async function testArxivImport() {
            const paperId = document.getElementById('testPaperId').value;
            const arxivId = document.getElementById('testArxivId').value;

            if (!paperId) {
                alert('请先添加论文获取ID，或手动输入论文ID');
                return;
            }

            log(`测试 arXiv导入: paper_id=${paperId}, arxiv_id=${arxivId}`);

            try {
                const response = await fetch(`/api/papers/${paperId}/import-from-arxiv`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        arxiv_input: arxivId
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();
                log('✓ arXiv导入成功!', 'success');
                showResult('arxiv-result', '✓ 导入成功: ' + JSON.stringify(data), true);
            } catch (error) {
                log('✗ arXiv导入失败: ' + error.message, 'error');
                showResult('arxiv-result', '✗ 失败: ' + error.message, false);
            }
        }

        // 页面加载时自动测试健康检查
        window.addEventListener('load', () => {
            log('页面加载完成', 'info');
            log('开始自动测试...', 'info');
            testHealth();
        });
    </script>
</body>
</html>
