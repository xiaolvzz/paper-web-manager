<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统状态检查</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-card {
            margin: 10px 0;
            transition: all 0.3s;
        }
        .status-ok { border-left: 4px solid #28a745; }
        .status-error { border-left: 4px solid #dc3545; }
        .status-loading { border-left: 4px solid #ffc107; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            max-height: 300px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>🔍 系统状态检查</h1>
        <p class="text-muted">检查后端API和数据库连接状态</p>

        <button class="btn btn-primary btn-lg mb-4" onclick="checkAllStatus()">刷新状态</button>

        <div id="statusResults"></div>
    </div>

    <script>
        async function checkAllStatus() {
            const resultsDiv = document.getElementById('statusResults');
            resultsDiv.innerHTML = '<div class="spinner-border"></div> 检查中...';

            const checks = [
                { name: '后端健康检查', url: '/api/health', key: 'health' },
                { name: 'arXiv服务状态', url: '/api/arxiv/health', key: 'arxiv' },
                { name: '论文列表API', url: '/api/papers/', key: 'papers' },
                { name: '关系图API', url: '/api/relations/graph', key: 'relations' }
            ];

            let html = '';

            for (let check of checks) {
                html += `<div class="card status-card status-loading" id="check-${check.key}">
                    <div class="card-body">
                        <h5>${check.name}</h5>
                        <div class="status-content">
                            <div class="spinner-border spinner-border-sm"></div> 检查中...
                        </div>
                    </div>
                </div>`;
            }

            resultsDiv.innerHTML = html;

            // 逐个检查
            for (let check of checks) {
                await checkEndpoint(check);
            }
        }

        async function checkEndpoint(check) {
            const card = document.getElementById(`check-${check.key}`);
            const content = card.querySelector('.status-content');

            try {
                console.log(`Checking ${check.name}: ${check.url}`);
                const response = await fetch(check.url);

                console.log(`Response status: ${response.status}`);
                const contentType = response.headers.get('content-type');
                console.log(`Content-Type: ${contentType}`);

                let data;
                let isJson = contentType && contentType.includes('application/json');

                if (isJson) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    data = { raw_response: text.substring(0, 500) };
                }

                console.log(`Response data:`, data);

                if (response.ok) {
                    card.className = 'card status-card status-ok';
                    content.innerHTML = `
                        <div class="text-success">✓ 状态码: ${response.status}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    card.className = 'card status-card status-error';
                    content.innerHTML = `
                        <div class="text-danger">✗ 状态码: ${response.status}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                console.error(`Error checking ${check.name}:`, error);
                card.className = 'card status-card status-error';
                content.innerHTML = `
                    <div class="text-danger">✗ 请求失败</div>
                    <div class="alert alert-danger mt-2">
                        <strong>错误:</strong> ${error.message}
                    </div>
                    <small class="text-muted">查看浏览器控制台获取更多信息</small>
                `;
            }
        }

        // 页面加载时自动检查
        window.onload = () => {
            checkAllStatus();
        };
    </script>
</body>
</html>
