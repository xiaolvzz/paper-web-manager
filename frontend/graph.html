<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文关系图 - 论文管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <style>
        #graph-container {
            height: calc(100vh - 120px);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📚 论文管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">论文列表</a>
                <a class="nav-link active" href="/graph">关系图</a>
                <a class="nav-link" href="#" onclick="openAISettings(); return false;">
                    ⚙️ AI设置
                    <span class="badge bg-primary" id="currentModelBadge" style="font-size: 0.7rem;">加载中</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row mb-3">
            <div class="col">
                <h4>📊 论文关系图谱</h4>
                <p class="text-muted">点击节点查看论文详情，拖拽节点调整布局</p>
            </div>
            <div class="col-auto">
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-primary" onclick="fitGraph()">适应屏幕</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="resetZoom()">重置缩放</button>
                    <button class="btn btn-sm btn-outline-info" data-bs-toggle="modal" data-bs-target="#filterModal">
                        🔍 筛选
                    </button>
                </div>
            </div>
        </div>

        <!-- 标签快速选择面板 -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-body py-2">
                        <div class="d-flex gap-2 align-items-center flex-wrap">
                            <strong class="text-muted small">🏷️ 标签筛选:</strong>
                            <div id="tagsQuickFilter" class="d-flex gap-2 flex-wrap">
                                <!-- 动态生成标签按钮 -->
                            </div>
                            <button class="btn btn-sm btn-outline-secondary" onclick="clearTagFilter()">清除</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选器和图例 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="d-flex gap-2 align-items-center flex-wrap">
                    <strong class="text-muted small">领域筛选:</strong>
                    <select class="form-select form-select-sm" style="width: auto;" id="domainFilter" onchange="applyFilters()">
                        <option value="">全部领域</option>
                    </select>
                    <button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">清除</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="d-flex gap-2 justify-content-end flex-wrap" id="relationLegend">
                    <!-- 动态生成关系类型图例 -->
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="row mb-3">
            <div class="col">
                <div class="d-flex gap-3 small text-muted">
                    <span id="statsNodes">论文: 0</span>
                    <span id="statsEdges">关系: 0</span>
                    <span id="statsDomains">领域: 0</span>
                </div>
            </div>
        </div>

        <!-- 关系图容器 -->
        <div id="graph-container"></div>

        <!-- 加载状态 -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2 text-muted">加载关系图数据...</p>
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="empty-state d-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <h5>还没有关联关系</h5>
            <p>在论文详情页添加关联关系后，这里会显示关系图谱</p>
        </div>
    </div>

    <!-- 高级筛选模态框 -->
    <div class="modal fade" id="filterModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🔍 高级筛选</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">按领域筛选</label>
                        <select class="form-select" id="modalDomainFilter">
                            <option value="">全部领域</option>
                        </select>
                        <small class="text-muted">只显示属于该领域的论文及其关系</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">按关系类型筛选</label>
                        <select class="form-select" id="modalRelationFilter">
                            <option value="">全部关系</option>
                            <option value="derived_from">衍生关系</option>
                            <option value="extends">扩展关系</option>
                            <option value="method_similar">方法相似</option>
                            <option value="problem_related">问题相关</option>
                            <option value="compares_with">对比研究</option>
                            <option value="same_domain">同领域</option>
                            <option value="baseline">基线方法</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="applyModalFilters()" data-bs-dismiss="modal">应用</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 标签管理模态框 -->
    <div class="modal fade" id="tagManagerModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">🏷️ 管理标签</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tagManagerPaperId">

                    <h6 class="mb-3">论文：<span id="tagManagerPaperTitle" class="text-primary"></span></h6>

                    <!-- 当前标签 -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">当前标签</label>
                        <div id="currentTagsList" class="d-flex gap-2 flex-wrap">
                            <span class="text-muted small">暂无标签</span>
                        </div>
                    </div>

                    <!-- 添加标签 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">添加标签</label>
                        <div id="availableTagsList" class="d-flex gap-2 flex-wrap" style="max-height: 300px; overflow-y: auto;">
                            <!-- 动态生成可用标签 -->
                        </div>
                    </div>

                    <!-- 创建自定义标签 -->
                    <div class="card bg-light">
                        <div class="card-body">
                            <h6 class="card-title">创建自定义标签</h6>
                            <div class="row g-2">
                                <div class="col-md-5">
                                    <input type="text" class="form-control form-control-sm" id="newTagName" placeholder="标签名称">
                                </div>
                                <div class="col-md-3">
                                    <input type="color" class="form-control form-control-sm" id="newTagColor" value="#6366f1">
                                </div>
                                <div class="col-md-2">
                                    <input type="text" class="form-control form-control-sm" id="newTagIcon" placeholder="🏷️" maxlength="2">
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-sm btn-success w-100" onclick="createCustomTag()">创建</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div id="contextMenu" class="context-menu" style="display: none;">
        <div class="context-menu-item" onclick="openTagManager()">
            🏷️ 管理标签
        </div>
        <div class="context-menu-item" onclick="viewPaperDetails()">
            📖 查看详情
        </div>
    </div>

    <script id="aiSettingsModalContainer"></script>
    <script>
        // 动态插入AI设置Modal
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof getAISettingsModalHTML === 'function') {
                document.getElementById('aiSettingsModalContainer').outerHTML = getAISettingsModalHTML();
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/cache.js"></script>
    <script src="/assets/js/loading.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ai-settings.js"></script>
    <script src="/assets/js/graph.js"></script>
</body>
</html>
