<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文关系图 - 论文管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <style>
        #graph-container {
            height: calc(100vh - 120px);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">📚 论文管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">论文列表</a>
                <a class="nav-link active" href="/graph">关系图</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row mb-3">
            <div class="col">
                <h4>📊 论文关系图谱</h4>
                <p class="text-muted">点击节点查看论文详情，拖拽节点调整布局</p>
            </div>
            <div class="col-auto">
                <div class="btn-group">
                    <button class="btn btn-sm btn-outline-primary" onclick="fitGraph()">适应屏幕</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="resetZoom()">重置缩放</button>
                </div>
            </div>
        </div>

        <!-- 图例 -->
        <div class="row mb-3">
            <div class="col">
                <div class="d-flex gap-3">
                    <span class="relation-badge relation-method_similar">方法相似</span>
                    <span class="relation-badge relation-problem_related">问题相关</span>
                    <span class="relation-badge relation-custom">自定义</span>
                </div>
            </div>
        </div>

        <!-- 关系图容器 -->
        <div id="graph-container"></div>

        <!-- 加载状态 -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2 text-muted">加载关系图数据...</p>
        </div>

        <!-- 空状态 -->
        <div id="empty-state" class="empty-state d-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
            <h5>还没有关联关系</h5>
            <p>在论文详情页添加关联关系后，这里会显示关系图谱</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/graph.js"></script>
</body>
</html>
