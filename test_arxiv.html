<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv搜索测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>arXiv 搜索功能测试</h1>
        <p class="text-muted">此页面用于测试arXiv搜索API</p>

        <!-- 健康检查 -->
        <div class="card mt-4">
            <div class="card-body">
                <h5>服务状态检查</h5>
                <button class="btn btn-info" onclick="checkHealth()">检查arXiv服务状态</button>
                <div id="healthStatus" class="mt-3"></div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5>搜索论文</h5>
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="searchQuery" placeholder="输入关键词（例如：DriveWorld-VLA）" value="DriveWorld-VLA">
                    <button class="btn btn-primary" onclick="testSearch()">搜索</button>
                </div>

                <div id="loading" class="d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <span class="ms-2">搜索中...</span>
                </div>

                <div id="results" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkHealth() {
            const statusDiv = document.getElementById('healthStatus');
            statusDiv.innerHTML = '<div class="spinner-border spinner-border-sm"></div> 检查中...';

            try {
                const response = await fetch('/api/arxiv/health');
                const data = await response.json();

                console.log('Health check:', data);

                if (data.arxiv_available) {
                    statusDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✓ ${data.message}
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ✗ ${data.message}
                            <br><small>请检查服务器日志或联系管理员</small>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Health check failed:', error);
                statusDiv.innerHTML = `
                    <div class="alert alert-danger">
                        健康检查失败: ${error.message}
                    </div>
                `;
            }
        }

        async function testSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');

            if (!query) {
                resultsDiv.innerHTML = '<div class="alert alert-warning">请输入搜索关键词</div>';
                return;
            }

            loadingDiv.classList.remove('d-none');
            resultsDiv.innerHTML = '';

            try {
                console.log('搜索关键词:', query);

                // 调用API
                const response = await fetch(`/api/arxiv/search?query=${encodeURIComponent(query)}&max_results=10`);
                console.log('响应状态:', response.status);

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '请求失败');
                }

                const data = await response.json();
                console.log('搜索结果:', data);

                // 显示结果
                if (data.count === 0) {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-warning">
                            <h6>未找到结果</h6>
                            <p>搜索词: ${escapeHtml(query)}</p>
                            <p>实际查询: ${escapeHtml(data.search_query || query)}</p>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="alert alert-success">
                            找到 ${data.count} 篇论文
                            <br><small>实际查询: ${escapeHtml(data.search_query || query)}</small>
                        </div>
                        ${data.results.map((paper, i) => `
                            <div class="card mb-3">
                                <div class="card-body">
                                    <h6 class="card-title">${i + 1}. ${escapeHtml(paper.title)}</h6>
                                    <p class="card-text">
                                        <strong>作者:</strong> ${escapeHtml(paper.authors)}<br>
                                        <strong>发布日期:</strong> ${paper.published} (${paper.year})<br>
                                        <strong>arXiv ID:</strong> ${paper.arxiv_id}<br>
                                        <strong>分类:</strong> ${escapeHtml(paper.categories)}
                                    </p>
                                    <p class="card-text"><small class="text-muted">${escapeHtml(paper.abstract.substring(0, 200))}...</small></p>
                                    <a href="${paper.pdf_url}" target="_blank" class="btn btn-sm btn-primary">查看PDF</a>
                                </div>
                            </div>
                        `).join('')}
                    `;
                }
            } catch (error) {
                console.error('搜索错误:', error);
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>搜索失败</h6>
                        <p>${escapeHtml(error.message)}</p>
                    </div>
                `;
            } finally {
                loadingDiv.classList.add('d-none');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // 回车搜索
        document.getElementById('searchQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') testSearch();
        });
    </script>
</body>
</html>
